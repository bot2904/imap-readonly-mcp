# Example configuration file for the read-only mail MCP server.
account:
  protocol: imap
  description: "Personal IMAP mailbox"
  host: imap.example.com
  port: 993
  username: user@example.com
  password: change-me
  # Exact, case-insensitive folder policy; excluded_folders overrides allowed_folders.
  # allowed_folders: [INBOX, Archive]
  # excluded_folders: [Spam]
cache_path: email_cache.sqlite
fetch_concurrency: 6
